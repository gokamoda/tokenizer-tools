[project]
name = "tokenizer-tools"
version = "0.1.0"
description = "Load Hugging Face tokenizers with fixes for known problems"
authors = [
    { name = "gokamoda", email = "gokamoda@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "transformers>=5.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.4",
    "ruff>=0.7.2",
    "ty>=0.0.5",
    # tokenizers of the models tested (rinna's T5Tokenizer)
    "sentencepiece>=0.2.1",
    "protobuf>=3.20.3",
]

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["*_test.py"]
markers = [
    "network: downloads tokenizers from the Hugging Face Hub (run with -m network)",
]
addopts = "-m 'not network'"

[tool.ruff]
exclude = [".git", ".mypy_cache", ".ruff_cache", ".venv"]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []
select = ["A", "B", "E", "F", "I", "N", "W", "PL", "UP"]
ignore = [
    "E501",  # Line too long, handled by the formatter
    "PLC0415",  # import inside a function: transformers is imported only when used
    "PLR2004",  # Magic value used in comparison
]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenizer_tools"]
exclude = ["*_test.py"]
